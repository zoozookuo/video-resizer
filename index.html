<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>影片裁切轉檔工具 · Video Resizer</title>
<style>
  :root{
    --bg:#0b1020;--panel:#141b30;--panel-2:#1b2440;--border:#2a3656;
    --text:#e8ecf5;--muted:#94a0bd;--blue:#2563eb;--blue-2:#3b82f6;
    --green:#16a34a;--red:#ef4444;--amber:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI','Noto Sans TC',sans-serif;
    -webkit-font-smoothing:antialiased}
  .page{max-width:980px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:28px;margin:0 0 8px}
  .lead{color:var(--muted);line-height:1.6;margin:0 0 18px;max-width:660px}
  .spec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
  .spec-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}
  .spec-size{font-weight:700;font-size:16px;margin-bottom:6px}
  .spec-line{color:var(--muted);font-size:13px}
  .dropzone{border:2px dashed var(--border);border-radius:16px;padding:34px 20px;text-align:center;
    cursor:pointer;transition:.15s;background:var(--panel)}
  .dropzone:hover,.dropzone.over{border-color:var(--blue-2);background:var(--panel-2)}
  .drop-icon{font-size:30px;color:var(--blue-2)}
  .drop-title{font-weight:600;margin-top:8px}
  .drop-sub{color:var(--muted);font-size:13px;margin-top:4px}
  .src-buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
  button{font-family:inherit}
  .btn-primary,.btn-secondary{border:none;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed}
  .btn-secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
  .progress-wrap{margin:16px 0}
  .progress-bar{height:10px;background:var(--panel-2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
  .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--blue-2));transition:width .2s}
  .progress-text,.phase-note{color:var(--muted);font-size:13px;margin-top:8px}
  .warn-banner{background:rgba(245,158,11,.12);border:1px solid var(--amber);color:#fde68a;
    border-radius:10px;padding:12px 14px;font-size:14px;margin:14px 0}
  .warn-banner code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}
  .entries{display:flex;flex-direction:column;gap:18px;margin-top:18px}
  .entry{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px}
  .entry-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .thumb{width:48px;height:64px;border-radius:6px;background:#000;border:1px solid var(--border);flex:none;object-fit:cover}
  .entry-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:42%}
  .entry-meta{color:var(--muted);font-size:13px}
  .btn-remove{margin-left:auto;background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px}
  .status-pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--border)}
  .s-idle{color:var(--muted)}
  .s-processing{color:var(--blue-2);border-color:var(--blue-2)}
  .s-done{color:#4ade80;border-color:var(--green)}
  .s-error{color:#fca5a5;border-color:var(--red)}
  .crop-stage{position:relative;width:100%;max-width:520px;margin:0 auto;user-select:none;touch-action:none;line-height:0}
  .crop-video{width:100%;height:auto;display:block;border-radius:10px;background:#000}
  .crop-box{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55);border:2px solid var(--blue-2);cursor:move;touch-action:none}
  .crop-grid{position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.4) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.4) 1px,transparent 1px);
    background-size:33.33% 33.33%}
  .handle{position:absolute;width:16px;height:16px;background:#fff;border:2px solid var(--blue);border-radius:4px;touch-action:none}
  .crop-actions{display:flex;gap:6px;flex-wrap:wrap;max-width:520px;margin:10px auto 0;align-items:center;justify-content:center}
  .crop-hint{color:var(--muted);font-size:12px;width:100%;text-align:center;margin-bottom:2px}
  .btn-mini{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;
    padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
  .btn-mini.accent{border-color:var(--blue-2);color:#bfdbfe}
  .results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
  .result-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:10px}
  .result-title{font-weight:700;font-size:14px;margin-bottom:8px}
  .result-row{display:flex;align-items:center;gap:6px;width:100%;background:var(--panel);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:7px 9px;margin-bottom:6px;cursor:pointer;font-size:12px;text-align:left}
  .result-row:hover{border-color:var(--blue-2)}
  .result-row.over{border-color:var(--amber)}
  .rk{font-weight:700;width:34px}.rsize{font-weight:600}.rlimit{color:var(--muted)}.rdl{margin-left:auto;color:var(--blue-2)}
  .entry-error{color:#fca5a5;font-size:13px;margin-top:10px}
  .foot{color:var(--muted);font-size:12px;margin-top:36px;text-align:center;line-height:1.6}
  @media (max-width:640px){.spec-grid,.results{grid-template-columns:1fr}.entry-name{max-width:36%}}
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>影片裁切轉檔工具</h1>
    <p class="lead">上傳一個或多個 <b>mp4 / mov</b>，裁切成 3:4 並輸出三種尺寸（含首格 JPG）。
      全程在你的瀏覽器內處理，影片不會上傳到任何伺服器。</p>
    <div class="spec-grid" id="specGrid"></div>
  </header>

  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept=".mp4,.mov,video/mp4,video/quicktime" multiple hidden />
    <input type="file" id="folderInput" webkitdirectory directory multiple hidden />
    <div class="drop-icon">⬆</div>
    <div class="drop-title">點此選擇，或拖曳影片到這裡</div>
    <div class="drop-sub">支援 mp4、mov · 可一次多個</div>
  </div>
  <div class="src-buttons">
    <button class="btn-secondary" id="pickFiles">選擇 MP4 / MOV 檔案</button>
    <button class="btn-secondary" id="pickFolder">選擇整個資料夾</button>
  </div>

  <div class="controls" id="controls" style="display:none">
    <button class="btn-primary" id="startBtn"></button>
    <button class="btn-secondary" id="zipBtn" style="display:none">⤓ 全部下載 (ZIP)</button>
  </div>

  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText"></div>
  </div>
  <div class="phase-note" id="phaseNote" style="display:none"></div>

  <div class="warn-banner" id="warnBanner" style="display:none">
    ⚠ 有部分輸出無法壓到目標大小以下（檔名標記 <code>_OVER</code>）。通常是影片較長或畫面變化劇烈，已盡力壓到最接近。
  </div>

  <div class="entries" id="entries"></div>

  <footer class="foot">
    裁切鎖定 3:4、保留原始聲音、輸出 H.264 + AAC（faststart）。處理速度取決於影片長度與裝置效能。
  </footer>
</main>

<!-- Libraries via UMD script tags (globals: JSZip, FFmpegWASM, FFmpegUtil).
     The UMD build handles its own worker internally, which a bare ES-module
     CDN import does not — so this is the reliable no-build path. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>

<script>
const { FFmpeg } = FFmpegWASM;
const { toBlobURL, fetchFile } = FFmpegUtil;

/* ---------------- presets ---------------- */
const KB = 1024, MB = 1024 * 1024;
const ASPECT_RATIO = 3 / 4; // width / height
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const PRESETS = [
  { key:'270x360',  width:270,  height:360,  videoLimitBytes:500*KB, jpgLimitBytes:60*KB,  audioKbps:48 },
  { key:'420x560',  width:420,  height:560,  videoLimitBytes:800*KB, jpgLimitBytes:80*KB,  audioKbps:64 },
  { key:'960x1280', width:960,  height:1280, videoLimitBytes:1*MB,   jpgLimitBytes:100*KB, audioKbps:96 },
];
function formatBytes(b){
  if (b < KB) return b + 'B';
  if (b < MB) return Math.round(b/KB) + 'kb';
  return (b/MB).toFixed(2) + 'MB';
}

/* ---------------- ffmpeg (single-thread; no special headers needed) ---------------- */
const CORE_BASE = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';
const FFMPEG_BASE = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd';
let ffmpeg = null, loadPromise = null;

// Fetch a URL into a same-origin blob URL while reporting download progress.
async function fetchBlobURLProgress(url, mime, onProgress){
  const res = await fetch(url);
  if (!res.ok) throw new Error(`下載失敗 ${res.status}: ${url}`);
  const total = Number(res.headers.get('Content-Length')) || 0;
  if (!res.body) { // fallback: no streaming
    const buf = new Uint8Array(await res.arrayBuffer());
    if (onProgress) onProgress(buf.length, total || buf.length);
    return URL.createObjectURL(new Blob([buf], { type: mime }));
  }
  const reader = res.body.getReader();
  const chunks = []; let received = 0;
  for (;;){
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); received += value.length;
    if (onProgress) onProgress(received, total);
  }
  return URL.createObjectURL(new Blob(chunks, { type: mime }));
}

function getFFmpeg(onProgress){
  if (ffmpeg) return Promise.resolve(ffmpeg);
  if (loadPromise) return loadPromise;
  loadPromise = (async () => {
    const inst = new FFmpeg();
    // classWorkerURL: the FFmpeg class spawns its own (module) worker, which
    // dynamically imports the ESM core — so the core MUST be the dist/esm build.
    // Loading these straight from a CDN fails ("cannot be accessed from origin")
    // because browsers block cross-origin Worker scripts, so we fetch them into
    // same-origin blob URLs first.
    const classWorkerURL = await toBlobURL(`${FFMPEG_BASE}/814.ffmpeg.js`, 'text/javascript');
    const coreURL = await toBlobURL(`${CORE_BASE}/ffmpeg-core.js`, 'text/javascript');
    // The wasm is the big (~30MB) file — fetch it with progress feedback.
    const wasmURL = await fetchBlobURLProgress(`${CORE_BASE}/ffmpeg-core.wasm`, 'application/wasm', onProgress);
    await inst.load({ classWorkerURL, coreURL, wasmURL });
    ffmpeg = inst;
    return inst;
  })();
  return loadPromise;
}

/* ---------------- processing ---------------- */
function evenClamp(v, max){
  v = Math.round(v); if (v % 2 !== 0) v -= 1; if (v < 2) v = 2;
  if (v > max) v = max % 2 === 0 ? max : max - 1;
  return v;
}
function cropToPixels(crop, src){
  let w = evenClamp(crop.nw * src.width, src.width);
  let h = evenClamp(crop.nh * src.height, src.height);
  let x = Math.round(crop.nx * src.width);
  let y = Math.round(crop.ny * src.height);
  if (x % 2 !== 0) x -= 1; if (y % 2 !== 0) y -= 1;
  if (x < 0) x = 0; if (y < 0) y = 0;
  if (x + w > src.width)  x = Math.max(0, src.width  - w);
  if (y + h > src.height) y = Math.max(0, src.height - h);
  return { x, y, w, h };
}
const baseName = n => n.replace(/\.[^/.]+$/, '').replace(/[^\w.-]+/g, '_');
async function safeDelete(ff, name){ try { await ff.deleteFile(name); } catch(e){} }

async function encodeMp4(ff, inputName, vf, preset, duration, onRatio){
  const out = `v_${preset.key}.mp4`;
  const limit = preset.videoLimitBytes;
  const target = limit * 0.92;
  const dur = Math.max(0.5, duration || 1);
  const totalKbps = (target * 8) / 1000 / dur;
  let videoKbps = Math.max(40, Math.floor(totalKbps - preset.audioKbps));
  let best = null;
  const MAX = 4;
  for (let attempt = 0; attempt < MAX; attempt++){
    const handler = ({ progress }) => onRatio(Math.min(1, Math.max(0, attempt/MAX + (progress||0)/MAX)));
    ff.on('progress', handler);
    await ff.exec([
      '-i', inputName, '-vf', vf,
      '-c:v', 'libx264', '-preset', 'veryfast',
      '-b:v', `${videoKbps}k`, '-maxrate', `${Math.floor(videoKbps*1.45)}k`, '-bufsize', `${videoKbps*2}k`,
      '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', `${preset.audioKbps}k`,
      '-movflags', '+faststart', '-y', out,
    ]);
    ff.off('progress', handler);
    const data = await ff.readFile(out);
    best = data;
    if (data.byteLength <= limit) break;
    const ratio = (limit / data.byteLength) * 0.9;
    const next = Math.max(24, Math.floor((videoKbps + preset.audioKbps) * ratio - preset.audioKbps));
    if (next >= videoKbps) break;
    videoKbps = next;
  }
  await safeDelete(ff, out);
  return best;
}

async function encodeJpg(ff, inputName, vf, preset, onRatio){
  const out = `f_${preset.key}.jpg`;
  const limit = preset.jpgLimitBytes;
  const qSteps = [3, 6, 9, 13, 18, 24, 31];
  let best = null;
  for (let i = 0; i < qSteps.length; i++){
    onRatio(i / qSteps.length);
    await ff.exec(['-i', inputName, '-vf', vf, '-frames:v', '1', '-q:v', String(qSteps[i]), '-y', out]);
    const data = await ff.readFile(out);
    best = data;
    if (data.byteLength <= limit) break;
  }
  await safeDelete(ff, out);
  return best;
}

function makeResult(stem, preset, kind, data, limit){
  const size = data.byteLength;
  const within = size <= limit;
  const filename = `${stem}_${preset.key}_${formatBytes(size)}${within ? '' : '_OVER'}.${kind}`;
  const mime = kind === 'mp4' ? 'video/mp4' : 'image/jpeg';
  return { presetKey: preset.key, kind, filename, blob: new Blob([data], { type: mime }), size, limit, withinLimit: within };
}

async function processFile(ff, file, crop, src, onProgress){
  const ext = (file.name.split('.').pop() || 'mp4').toLowerCase();
  const inputName = `in_${Date.now()}.${ext}`;
  await ff.writeFile(inputName, await fetchFile(file));
  const { x, y, w, h } = cropToPixels(crop, src);
  const cropFilter = `crop=${w}:${h}:${x}:${y}`;
  const stem = baseName(file.name);
  const results = [];
  try {
    let unit = 0;
    const totalUnits = PRESETS.length * 2;
    for (const preset of PRESETS){
      const vf = `${cropFilter},scale=${preset.width}:${preset.height}:flags=lanczos`;
      const mp4 = await encodeMp4(ff, inputName, vf, preset, src.duration, r => onProgress((unit + r)/totalUnits, `mp4 ${preset.key}`));
      results.push(makeResult(stem, preset, 'mp4', mp4, preset.videoLimitBytes)); unit++;
      const jpg = await encodeJpg(ff, inputName, vf, preset, r => onProgress((unit + r)/totalUnits, `jpg ${preset.key}`));
      results.push(makeResult(stem, preset, 'jpg', jpg, preset.jpgLimitBytes)); unit++;
    }
  } finally {
    await safeDelete(ff, inputName);
  }
  return results;
}

/* ---------------- cropper ---------------- */
const MIN_W = 32;
function defaultBox(dw, dh){
  let w = dw, h = w / ASPECT_RATIO;
  if (h > dh){ h = dh; w = h * ASPECT_RATIO; }
  return { x:(dw-w)/2, y:(dh-h)/2, w, h };
}
function clampBox(b, d){
  let { x, y, w } = b, h;
  w = Math.min(w, d.w); h = w / ASPECT_RATIO;
  if (h > d.h){ h = d.h; w = h * ASPECT_RATIO; }
  if (w < MIN_W){ w = MIN_W; h = w / ASPECT_RATIO; }
  x = Math.max(0, Math.min(x, d.w - w));
  y = Math.max(0, Math.min(y, d.h - h));
  return { x, y, w, h };
}

function setupCropper(entry, stageEl){
  const video = document.createElement('video');
  video.className = 'crop-video';
  video.src = entry.url; video.muted = true; video.loop = true; video.autoplay = true;
  video.playsInline = true; video.setAttribute('playsinline','');
  const boxEl = document.createElement('div');
  boxEl.className = 'crop-box';
  boxEl.innerHTML = '<div class="crop-grid"></div>' +
    ['nw','ne','sw','se'].map(c => `<div class="handle h-${c}" data-corner="${c}"></div>`).join('');
  stageEl.appendChild(video);
  stageEl.appendChild(boxEl);
  const hs = {
    nw:{left:-8,top:-8,cursor:'nwse-resize'}, ne:{right:-8,top:-8,cursor:'nesw-resize'},
    sw:{left:-8,bottom:-8,cursor:'nesw-resize'}, se:{right:-8,bottom:-8,cursor:'nwse-resize'},
  };
  boxEl.querySelectorAll('.handle').forEach(el => {
    const s = hs[el.dataset.corner];
    for (const k in s) el.style[k] = (typeof s[k] === 'number') ? s[k]+'px' : s[k];
  });

  const thumb = entry.el.querySelector('.thumb');
  let disp = { w:0, h:0 };
  let box = null;
  let drag = null;

  function apply(){
    boxEl.style.left = box.x + 'px'; boxEl.style.top = box.y + 'px';
    boxEl.style.width = box.w + 'px'; boxEl.style.height = box.h + 'px';
    if (disp.w > 0 && disp.h > 0 && entry.src){
      entry.crop = { nx: box.x/disp.w, ny: box.y/disp.h, nw: box.w/disp.w, nh: box.h/disp.h };
    }
  }
  function measure(){ const r = video.getBoundingClientRect(); return { w:r.width, h:r.height }; }

  function drawThumb(){
    if (!thumb) return;
    const ctx = thumb.getContext('2d');
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    const cw = thumb.width, ch = thumb.height;
    const sc = Math.max(cw/vw, ch/vh);
    const dw = vw*sc, dh = vh*sc;
    try { ctx.drawImage(video, (cw-dw)/2, (ch-dh)/2, dw, dh); } catch(e){}
  }

  video.addEventListener('loadedmetadata', () => {
    entry.src = { width: video.videoWidth, height: video.videoHeight, duration: video.duration };
    disp = measure();
    box = defaultBox(disp.w, disp.h);
    apply();
  });
  video.addEventListener('loadeddata', drawThumb);

  const ro = new ResizeObserver(() => {
    if (!box || !entry.src) return;
    const nd = measure();
    if (nd.w === 0 || disp.w === 0) return;
    const sx = nd.w / disp.w, sy = nd.h / disp.h;
    box = { x: box.x*sx, y: box.y*sy, w: box.w*sx, h: box.h*sy };
    disp = nd; apply();
  });
  ro.observe(stageEl);

  function down(mode){
    return (e) => {
      e.preventDefault(); e.stopPropagation();
      if (!box) return;
      e.target.setPointerCapture(e.pointerId);
      drag = { mode, sx:e.clientX, sy:e.clientY, orig:{...box} };
    };
  }
  boxEl.addEventListener('pointerdown', down('move'));
  boxEl.querySelectorAll('.handle').forEach(el => el.addEventListener('pointerdown', down(el.dataset.corner)));

  stageEl.addEventListener('pointermove', (e) => {
    if (!drag || !entry.src) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy, o = drag.orig;
    let next;
    if (drag.mode === 'move'){
      next = { x:o.x+dx, y:o.y+dy, w:o.w, h:o.h };
    } else {
      const right = o.x + o.w, bottom = o.y + o.h;
      let newW = (drag.mode === 'se' || drag.mode === 'ne') ? o.w + dx : o.w - dx;
      newW = Math.max(MIN_W, newW);
      const newH = newW / ASPECT_RATIO;
      let x = o.x, y = o.y;
      if (drag.mode === 'nw'){ x = right - newW; y = bottom - newH; }
      else if (drag.mode === 'ne'){ x = o.x; y = bottom - newH; }
      else if (drag.mode === 'sw'){ x = right - newW; y = o.y; }
      next = { x, y, w:newW, h:newH };
    }
    box = clampBox(next, disp); apply();
  });
  function up(e){ drag = null; try { e.target.releasePointerCapture(e.pointerId); } catch(_){} }
  stageEl.addEventListener('pointerup', up);
  stageEl.addEventListener('pointercancel', up);

  // expose crop "spec" (scale + relative position) so it transfers across videos
  function getSpec(){
    if (!entry.src || disp.w <= 0) return null;
    const mb = defaultBox(disp.w, disp.h);
    const scale = clamp(box.w / mb.w, 0.1, 1);
    const rangeX = disp.w - box.w, rangeY = disp.h - box.h;
    const posX = rangeX > 0.5 ? clamp(box.x/rangeX, 0, 1) : 0.5;
    const posY = rangeY > 0.5 ? clamp(box.y/rangeY, 0, 1) : 0.5;
    return { scale, posX, posY };
  }
  function setSpec(partial){
    if (!entry.src || disp.w <= 0) return;
    const cur = getSpec() || { scale:1, posX:.5, posY:.5 };
    const s = Object.assign({}, cur, partial);
    const mb = defaultBox(disp.w, disp.h);
    const w = mb.w * clamp(s.scale, 0.1, 1);
    const h = w / ASPECT_RATIO;
    const rangeX = disp.w - w, rangeY = disp.h - h;
    const x = (rangeX > 0 ? rangeX : 0) * clamp(s.posX, 0, 1);
    const y = (rangeY > 0 ? rangeY : 0) * clamp(s.posY, 0, 1);
    box = clampBox({ x, y, w }, disp); apply();
  }
  entry.getSpec = getSpec;
  entry.setSpec = setSpec;
  entry.resetCrop = () => setSpec({ scale:1, posX:.5, posY:.5 });
}

/* ---------------- UI / state ---------------- */
const state = { entries: [], running: false };
const $ = id => document.getElementById(id);

$('specGrid').innerHTML = PRESETS.map(p =>
  `<div class="spec-card"><div class="spec-size">${p.key}</div>
   <div class="spec-line">MP4 ≤ ${formatBytes(p.videoLimitBytes)}</div>
   <div class="spec-line">JPG ≤ ${formatBytes(p.jpgLimitBytes)}</div></div>`).join('');

function isVideo(f){ return /\.(mp4|mov)$/i.test(f.name) || f.type === 'video/mp4' || f.type === 'video/quicktime'; }

function addFiles(files){
  const list = Array.from(files).filter(isVideo);
  if (!list.length) return;
  for (const file of list){
    const entry = {
      id: `${file.name}-${file.size}-${Math.random().toString(36).slice(2,8)}`,
      file, url: URL.createObjectURL(file),
      crop: null, src: null, results: [], status: 'idle', error: null,
      el: null, getSpec: null, setSpec: null, resetCrop: null,
    };
    state.entries.push(entry);
    renderEntry(entry);
  }
  refreshControls();
}

const statusLabel = s => ({ idle:'待處理', processing:'處理中', done:'完成', error:'失敗' }[s] || s);

function renderEntry(entry){
  const sec = document.createElement('section');
  sec.className = 'entry';
  sec.innerHTML = `
    <div class="entry-head">
      <canvas class="thumb" width="96" height="128"></canvas>
      <div class="entry-name" title="${entry.file.name}">${entry.file.name}</div>
      <div class="entry-meta">${formatBytes(entry.file.size)}</div>
      <button class="btn-remove">移除</button>
      <span class="status-pill s-${entry.status}">${statusLabel(entry.status)}</span>
    </div>
    <div class="crop-stage"></div>
    <div class="crop-actions">
      <span class="crop-hint">拖曳裁切框移動、拉四角縮放（鎖定 3:4、無黑邊）。下方按鈕可一鍵切向某邊：</span>
      <button class="btn-mini" data-dir="center">置中</button>
      <button class="btn-mini" data-dir="top">靠上</button>
      <button class="btn-mini" data-dir="bottom">靠下</button>
      <button class="btn-mini" data-dir="left">靠左</button>
      <button class="btn-mini" data-dir="right">靠右</button>
      <button class="btn-mini reset-btn">重設</button>
      <button class="btn-mini accent apply-all-btn">套用此裁切到全部</button>
    </div>
    <div class="entry-error" style="display:none"></div>
    <div class="results" style="display:none"></div>`;
  entry.el = sec;
  $('entries').appendChild(sec);
  setupCropper(entry, sec.querySelector('.crop-stage'));

  sec.querySelectorAll('[data-dir]').forEach(b => b.addEventListener('click', () => {
    const d = b.dataset.dir;
    if (d === 'center') entry.setSpec && entry.setSpec({ posX:.5, posY:.5 });
    else if (d === 'top') entry.setSpec && entry.setSpec({ posY:0 });
    else if (d === 'bottom') entry.setSpec && entry.setSpec({ posY:1 });
    else if (d === 'left') entry.setSpec && entry.setSpec({ posX:0 });
    else if (d === 'right') entry.setSpec && entry.setSpec({ posX:1 });
  }));
  sec.querySelector('.reset-btn').addEventListener('click', () => entry.resetCrop && entry.resetCrop());
  sec.querySelector('.apply-all-btn').addEventListener('click', () => applyToAll(entry));
  sec.querySelector('.btn-remove').addEventListener('click', () => {
    if (state.running) return;
    URL.revokeObjectURL(entry.url);
    state.entries = state.entries.filter(e => e !== entry);
    sec.remove();
    refreshControls();
  });
}

function applyToAll(srcEntry){
  if (!srcEntry.getSpec) return;
  const spec = srcEntry.getSpec();
  if (!spec) return;
  let applied = 0;
  for (const e of state.entries){ if (e !== srcEntry && e.setSpec){ e.setSpec(spec); applied++; } }
  const note = $('phaseNote');
  note.style.display = ''; note.textContent = `已將此裁切設定套用到其他 ${applied} 個影片。`;
}

function updateStatus(entry){
  const pill = entry.el.querySelector('.status-pill');
  pill.className = `status-pill s-${entry.status}`;
  pill.textContent = statusLabel(entry.status);
  const err = entry.el.querySelector('.entry-error');
  if (entry.error){ err.style.display = ''; err.textContent = '錯誤：' + entry.error; }
  else err.style.display = 'none';
}

function renderResults(entry){
  const wrap = entry.el.querySelector('.results');
  if (!entry.results.length){ wrap.style.display = 'none'; wrap.innerHTML=''; return; }
  wrap.style.display = '';
  wrap.innerHTML = PRESETS.map(p => {
    const group = entry.results.filter(r => r.presetKey === p.key);
    const rows = group.map(r => `
      <button class="result-row${r.withinLimit ? '' : ' over'}" data-file="${r.filename}" title="下載 ${r.filename}">
        <span class="rk">${r.kind.toUpperCase()}</span>
        <span class="rsize">${formatBytes(r.size)}</span>
        <span class="rlimit">/ ${formatBytes(r.limit)} ${r.withinLimit ? '✓' : '✗'}</span>
        <span class="rdl">⤓</span>
      </button>`).join('');
    return `<div class="result-card"><div class="result-title">${p.key}</div>${rows}</div>`;
  }).join('');
  wrap.querySelectorAll('.result-row').forEach(btn => {
    btn.addEventListener('click', () => {
      const r = entry.results.find(x => x.filename === btn.dataset.file);
      if (r) downloadBlob(r.blob, r.filename);
    });
  });
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function refreshControls(){
  const has = state.entries.length > 0;
  $('controls').style.display = has ? 'flex' : 'none';
  const total = state.entries.length * PRESETS.length;
  $('startBtn').textContent = state.running ? '處理中…'
    : `開始轉檔（${state.entries.length} 個檔案 → ${total} 支影片 + 縮圖）`;
  $('startBtn').disabled = state.running;
  const anyDone = state.entries.some(e => e.results.length);
  $('zipBtn').style.display = anyDone ? '' : 'none';
  $('zipBtn').disabled = state.running;
  const anyOver = state.entries.some(e => e.results.some(r => !r.withinLimit));
  $('warnBanner').style.display = anyOver ? '' : 'none';
}

function setProgress(ratio, text){
  $('progressFill').style.width = Math.round(ratio*100) + '%';
  $('progressText').textContent = text;
}

async function start(){
  if (state.running || !state.entries.length) return;
  state.running = true;
  refreshControls();
  $('progressWrap').style.display = ''; $('phaseNote').style.display = 'none';
  setProgress(0, '首次載入轉檔引擎（約 30MB，下載後會快取，下次很快）…');
  try {
    const ff = await getFFmpeg((received, total) => {
      const mb = (received / 1048576).toFixed(1);
      const totStr = total ? ` / ${(total / 1048576).toFixed(0)}MB` : '';
      setProgress(total ? received / total : 0, `下載轉檔引擎… ${mb}MB${totStr}（只需這一次，之後會快取）`);
    });
    const totalUnits = state.entries.length;
    let idx = 0;
    for (const entry of state.entries){
      if (!entry.crop || !entry.src){ entry.status='error'; entry.error='影片資訊尚未載入，請稍候再試。'; updateStatus(entry); idx++; continue; }
      entry.status = 'processing'; entry.error = null; entry.results = [];
      updateStatus(entry); renderResults(entry);
      try {
        entry.results = await processFile(ff, entry.file, entry.crop, entry.src, (p, stage) => {
          setProgress(Math.min(0.99, (idx + p)/totalUnits), `處理中：${entry.file.name} → ${stage}`);
        });
        entry.status = 'done';
      } catch(err){
        entry.status = 'error'; entry.error = (err && err.message) ? err.message : String(err);
      }
      updateStatus(entry); renderResults(entry); refreshControls();
      idx++; setProgress(idx/totalUnits, '');
    }
    setProgress(1, '');
    $('progressWrap').style.display = 'none';
    $('phaseNote').style.display = ''; $('phaseNote').textContent = '全部完成';
  } catch(err){
    $('phaseNote').style.display = ''; $('phaseNote').textContent = '錯誤：' + ((err && err.message) ? err.message : String(err));
    $('progressWrap').style.display = 'none';
  } finally {
    state.running = false;
    refreshControls();
  }
}

async function downloadZip(){
  const all = state.entries.flatMap(e => e.results);
  if (!all.length || !window.JSZip) return;
  const zip = new window.JSZip();
  for (const r of all) zip.file(r.filename, r.blob);
  const blob = await zip.generateAsync({ type: 'blob' });
  downloadBlob(blob, `resized_videos_${Date.now()}.zip`);
}

/* ---------------- wire up ---------------- */
const dz = $('dropzone'), fi = $('fileInput'), folderInput = $('folderInput');
dz.addEventListener('click', () => fi.click());
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); addFiles(e.dataTransfer.files); });
fi.addEventListener('change', e => { if (e.target.files) addFiles(e.target.files); e.target.value=''; });
folderInput.addEventListener('change', e => { if (e.target.files) addFiles(e.target.files); e.target.value=''; });
$('pickFiles').addEventListener('click', () => fi.click());
$('pickFolder').addEventListener('click', () => folderInput.click());
$('startBtn').addEventListener('click', start);
$('zipBtn').addEventListener('click', downloadZip);
</script>
</body>
</html>
