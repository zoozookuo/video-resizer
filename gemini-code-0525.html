<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧影片批次裁切與轉檔工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
    <script>
        // --- 全域攔截器：修復 FFmpeg 跨網域 Worker 安全限制 ---
        (function patchWorker() {
            if (window._workerPatched) return;
            const OriginalWorker = window.Worker;
            window.Worker = function(url, options) {
                const urlStr = url instanceof URL ? url.href : url;
                if (typeof urlStr === 'string' && urlStr.startsWith('http') && urlStr.includes('@ffmpeg')) {
                    const blobCode = (options && options.type === 'module') ? `import '${urlStr}';` : `importScripts('${urlStr}');`;
                    const blob = new Blob([blobCode], { type: 'application/javascript' });
                    return new OriginalWorker(URL.createObjectURL(blob), options);
                }
                return new OriginalWorker(url, options);
            };
            window._workerPatched = true;
        })();
    </script>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 pb-20">
    <video id="hidden-video" playsinline hidden crossorigin="anonymous"></video>
    <canvas id="hidden-canvas" hidden></canvas>

    <div id="crop-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden flex flex-col">
            <div class="px-5 py-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800 flex items-center gap-2"> 調整裁切區域 (強制 3:4 無黑邊)</h3>
                <button onclick="closeCropModal()" class="p-1 text-slate-400 hover:text-slate-600 bg-slate-200 rounded-full font-bold px-2">✕</button>
            </div>
            <div class="p-6 bg-slate-100 flex-1 flex flex-col items-center">
                <div id="preview-box" class="relative bg-black rounded shadow-lg overflow-hidden flex items-center justify-center" style="width: 240px; height: 320px;">
                    <div class="absolute text-white/50 text-xs">預覽框 (3:4)</div>
                    <div id="preview-bg" class="w-full h-full" style="background-repeat: no-repeat;"></div>
                </div>
                <div class="mt-8 w-full bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <label class="block text-sm font-bold text-slate-700 mb-3 flex justify-between">
                        <span id="slider-label">左右移動裁切位置</span>
                        <span id="slider-badge" class="text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded text-xs">水平裁切</span>
                    </label>
                    <input type="range" id="crop-slider" min="0" max="100" value="50" oninput="updateCropPreview()" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
                    <div class="flex justify-between text-xs text-slate-400 mt-2">
                        <span id="slider-min-text">最左</span> <span>置中</span> <span id="slider-max-text">最右</span>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t flex justify-end gap-3 bg-white">
                <button onclick="closeCropModal()" class="px-5 py-2 text-slate-600 font-medium hover:bg-slate-100 rounded-xl transition">取消</button>
                <button onclick="saveCropModal()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition">確認儲存</button>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto p-4 sm:p-8 space-y-8">
        <header class="text-center pt-8 mb-8">
            <h1 class="text-3xl font-extrabold text-slate-900 flex items-center justify-center gap-3">
                影片批次無黑邊裁切神器
            </h1>
            <h2 class="text-xl font-bold text-indigo-600 mt-2 tracking-wide">
                Multiple Mix resize
            </h2>
            <p class="text-slate-500 mt-3 max-w-xl mx-auto">
                支援多檔案上傳。自動裁切為滿版 3:4，並精準控制檔案大小。完全於您的瀏覽器內離線運作。
            </p>
        </header>

        <div id="loading-engine-msg" class="bg-amber-50 border border-amber-200 text-amber-700 px-4 py-3 rounded-xl flex items-center gap-3 justify-center shadow-sm">
            <svg class="w-5 h-5 spin" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            <span class="font-medium">正在載入 FFmpeg 影音處理核心，請稍候...</span>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-10 transition-all hover:border-indigo-300">
            <label id="upload-label" class="block w-full border-2 border-dashed border-slate-300 rounded-xl p-8 sm:p-12 text-center transition cursor-pointer hover:bg-slate-50 hover:border-indigo-400">
                <input type="file" multiple accept="video/mp4,video/quicktime" onchange="handleFileUpload(event)" class="hidden" id="file-input" disabled>
                <div class="flex flex-col items-center justify-center gap-4">
                    <div class="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-full flex items-center justify-center text-3xl"> </div>
                    <div>
                        <p class="text-lg font-bold text-slate-700">點擊或拖曳上傳影片 (支援多選)</p>
                        <p class="text-sm text-slate-400 mt-1">接受 MP4, MOV 格式</p>
                    </div>
                </div>
            </label>
        </div>

        <div id="file-list-container" class="hidden space-y-4">
            <div class="flex justify-between items-end pb-2 border-b border-slate-200">
                <h2 class="text-xl font-bold text-slate-800">待處理清單 (<span id="file-count">0</span>)</h2>
                <button id="process-btn" onclick="processVideos()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/30 transition-all flex items-center gap-2 active:scale-95">
                    ▶ 開始批次轉檔
                </button>
            </div>
            <div id="file-list" class="grid gap-4">
                </div>
        </div>
    </div>

    <script>
        // --- 核心規格設定 --- 
        const TARGET_SPECS = [ 
            { name: '小尺寸', w: 270, h: 360, maxVidKB: 500, maxImgKB: 60 }, 
            { name: '中尺寸', w: 420, h: 560, maxVidKB: 800, maxImgKB: 80 }, 
            { name: '大尺寸', w: 960, h: 1280, maxVidKB: 1000, maxImgKB: 100 } 
        ]; 
        
        // --- 狀態變數 --- 
        let ffmpegInstance = null;
        let filesData = []; // { id, file, name, duration, vw, vh, crop, status, progress, results, objectURL } 
        let isProcessing = false;
        let editingFileId = null; 
        
        // --- DOM 元素 --- 
        const videoEl = document.getElementById('hidden-video'); 
        const canvasEl = document.getElementById('hidden-canvas'); 
        const fileInput = document.getElementById('file-input'); 
        const uploadLabel = document.getElementById('upload-label'); 
        const fileListContainer = document.getElementById('file-list-container');
        const fileListEl = document.getElementById('file-list'); 
        const fileCountEl = document.getElementById('file-count'); 
        const processBtn = document.getElementById('process-btn'); 
        const loadingMsg = document.getElementById('loading-engine-msg'); 
        
        // --- 工具函數 --- 
        const generateId = () => Math.random().toString(36).substr(2, 9); 
        const formatBytes = (bytes) => (bytes / 1024).toFixed(1) + ' KB'; 
        
        // --- 1. 初始化 FFmpeg --- 
        async function initApp() { 
            try { 
                const { FFmpeg } = window.FFmpegWASM; 
                const { toBlobURL } = window.FFmpegUtil; 
                ffmpegInstance = new FFmpeg(); 
                const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd'; 
                await ffmpegInstance.load({ 
                    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'), 
                    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm') 
                }); 
                loadingMsg.style.display = 'none'; 
                fileInput.disabled = false; 
            } catch (e) {
                console.error(e); 
                loadingMsg.innerHTML = " 引擎載入失敗，請確認網路連線"; 
                loadingMsg.className = "bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl flex items-center gap-3 justify-center shadow-sm"; 
            } 
        }
        window.addEventListener('load', initApp); 
        
        // --- 2. 處理檔案上傳 --- 
        window.handleFileUpload = async (e) => { 
            if (isProcessing) return; 
            const selected = Array.from(e.target.files).filter(f => f.type.startsWith('video/')); 
            if (selected.length === 0) return; 
            for (let file of selected) { 
                const id = generateId(); 
                const name = file.name.replace(/\.[^/.]+$/, ""); 
                const url = URL.createObjectURL(file); 
                videoEl.src = url; 
                await new Promise(r => { videoEl.onloadedmetadata = r; videoEl.load(); }); 
                const vw = videoEl.videoWidth; 
                const vh = videoEl.videoHeight; 
                const duration = videoEl.duration; 
                
                // 智慧計算 3:4 初始裁切框 (置中) 
                let cw, ch, cx, cy; 
                const targetRatio = 3 / 4; 
                const videoRatio = vw / vh; 
                if (videoRatio > targetRatio) { 
                    ch = vh; cw = Math.round(vh * targetRatio); cy = 0; cx = Math.round((vw - cw) / 2); 
                } else { 
                    cw = vw; ch = Math.round(vw / targetRatio); cx = 0; cy = Math.round((vh - ch) / 2); 
                }
                filesData.push({ id, file, name, duration, vw, vh, objectURL: url, crop: { cx, cy, cw, ch }, status: 'pending', progress: 0, results: null }); 
            } 
            e.target.value = ''; 
            renderFiles(); 
        }; 
        
        window.removeFile = (id) => { 
            if (isProcessing) return; 
            filesData = filesData.filter(f => f.id !== id); 
            renderFiles(); 
        }; 
        
        // --- 3. 渲染 UI --- 
        function renderFiles() { 
            if (filesData.length > 0) {
                fileListContainer.classList.remove('hidden'); 
                fileCountEl.innerText = filesData.length; 
            } else { 
                fileListContainer.classList.add('hidden'); 
            } 
            fileListEl.innerHTML = filesData.map(f => { 
                let statusHtml = ''; 
                if (f.status === 'pending') { 
                    statusHtml = ` <button onclick="openCropModal('${f.id}')" class="px-4 py-2 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-lg text-sm font-bold transition"> 調整裁切</button> <button onclick="removeFile('${f.id}')" class="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition font-bold">✕</button> `; 
                } else if (f.status === 'processing') { 
                    statusHtml = ` <div class="w-full sm:w-48"> <div class="flex justify-between text-xs font-bold text-indigo-600 mb-1"> <span>轉檔中...</span><span>${f.progress}%</span> </div> <div class="w-full bg-slate-200 rounded-full h-2"> <div class="bg-indigo-500 h-2 rounded-full transition-all" style="width: ${f.progress}%"></div> </div> </div> `; 
                } else if (f.status === 'done') { 
                    statusHtml = `<span class="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-bold"> 處理完成</span>`; 
                } 
                let resultsHtml = ''; 
                if (f.status === 'done' && f.results) { 
                    const cards = f.results.map((res, i) => { 
                        const spec = TARGET_SPECS[i]; 
                        return ` <div class="border border-slate-200 rounded-xl p-4 shadow-sm"> <div class="font-mono font-bold text-slate-800 text-lg mb-1">${res.specName}</div> <div class="text-xs text-slate-500 mb-4">${spec.name}</div> <div class="space-y-2"> <div class="flex items-center justify-between p-2 bg-slate-50 rounded-lg"> <div> <div class="text-xs font-bold text-slate-600">MP4 影片</div> <div class="text-xs font-mono ${res.vidPass ? 'text-emerald-600' : 'text-red-500'}">${formatBytes(res.vidSize)} / ${spec.maxVidKB}KB ${res.vidPass ? ' ' : ' '}</div> </div> <a href="${res.vidUrl}" download="${f.name}_${res.specName}.mp4" class="p-2 bg-indigo-100 text-indigo-700 rounded-lg font-bold">下載</a> </div> <div class="flex items-center justify-between p-2 bg-slate-50 rounded-lg"> <div> <div class="text-xs font-bold text-slate-600">JPG 封面</div> <div class="text-xs font-mono ${res.imgPass ? 'text-emerald-600' : 'text-red-500'}">${formatBytes(res.imgSize)} / ${spec.maxImgKB}KB ${res.imgPass ? ' ' : ' '}</div> </div> <a href="${res.imgUrl}" download="${f.name}_${res.specName}_thumb.jpg" class="p-2 bg-indigo-100 text-indigo-700 rounded-lg font-bold"> 下載</a> </div> </div> </div> `; 
                    }).join(''); 
                    resultsHtml = ` <div class="p-5 border-t border-slate-100 bg-white"> <div class="grid grid-cols-1 md:grid-cols-3 gap-4">${cards}</div> </div> `; 
                } 
                return ` <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden"> <div class="p-4 sm:p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 bg-slate-50/50"> <div class="flex items-center gap-4 w-full sm:w-auto"> <div class="w-12 h-12 bg-slate-200 rounded-lg flex items-center justify-center flex-shrink-0 text-xl"> </div> <div> <h3 class="font-bold text-slate-700 truncate max-w-xs sm:max-w-xs">${f.name}</h3> <p class="text-xs text-slate-400 font-mono">${f.vw}x${f.vh} • ${Math.round(f.duration)}秒</p> </div> </div> <div class="flex items-center gap-2 w-full sm:w-auto">${statusHtml}</div> </div> ${resultsHtml} </div> `; 
            }).join(''); 
        } 
        
        // --- 4. 裁切 Modal 邏輯 --- 
        const cropModal = document.getElementById('crop-modal'); 
        const slider = document.getElementById('crop-slider'); 
        const previewBg = document.getElementById('preview-bg'); 
        
        window.openCropModal = (id) => { 
            editingFileId = id; 
            const f = filesData.find(x => x.id === id); 
            const isWide = (f.vw / f.vh) > (3/4); 
            document.getElementById('slider-label').innerText = isWide ? '左右移動裁切位置' : '上下移動裁切位置'; 
            document.getElementById('slider-badge').innerText = isWide ? '水平裁切' : '垂直裁切'; 
            document.getElementById('slider-min-text').innerText = isWide ? '最左' : '最上'; 
            document.getElementById('slider-max-text').innerText = isWide ? '最右' : '最下'; 
            slider.max = isWide ? (f.vw - f.crop.cw) : (f.vh - f.crop.ch); 
            slider.value = isWide ? f.crop.cx : f.crop.cy; 
            previewBg.style.backgroundImage = `url(${f.objectURL})`; 
            previewBg.style.backgroundSize = isWide ? 'auto 100%' : '100% auto'; 
            cropModal.classList.remove('hidden'); 
            window.updateCropPreview(); 
        }; 
        
        window.closeCropModal = () => { 
            cropModal.classList.add('hidden'); 
            editingFileId = null; 
        }; 
        
        window.updateCropPreview = () => { 
            if (!editingFileId) return; 
            const f = filesData.find(x => x.id === editingFileId); 
            const isWide = (f.vw / f.vh) > (3/4); 
            const val = parseInt(slider.value); 
            // 更新預覽畫面位移 
            if (isWide) { 
                const percent = slider.max > 0 ? (val / slider.max) * 100 : 0; 
                previewBg.style.backgroundPosition = `${percent}% center`; 
            } else { 
                const percent = slider.max > 0 ? (val / slider.max) * 100 : 0; 
                previewBg.style.backgroundPosition = `center ${percent}%`; 
            } 
        }; 
        
        window.saveCropModal = () => { 
            const f = filesData.find(x => x.id === editingFileId); 
            const isWide = (f.vw / f.vh) > (3/4); 
            const val = parseInt(slider.value); 
            if (isWide) f.crop.cx = val; else f.crop.cy = val; 
            closeCropModal(); 
            renderFiles(); 
        }; 
        
        // --- 5. 智慧圖片壓縮 (自動降品質找合適大小) --- 
        async function compressImage(crop, targetW, targetH, maxKB) { 
            const ctx = canvasEl.getContext('2d'); 
            canvasEl.width = targetW; canvasEl.height = targetH; 
            ctx.drawImage(videoEl, crop.cx, crop.cy, crop.cw, crop.ch, 0, 0, targetW, targetH); 
            let quality = 0.9; 
            let blob = await new Promise(r => canvasEl.toBlob(r, 'image/jpeg', quality)); 
            while (blob.size > maxKB * 1024 && quality > 0.15) { 
                quality -= 0.05; // 更細緻的二分降質 
                blob = await new Promise(r => canvasEl.toBlob(r, 'image/jpeg', quality)); 
            } 
            return blob; 
        } 
        
        // --- 6. 核心處理邏輯 (批次轉檔) --- 
        window.processVideos = async () => { 
            if (!ffmpegInstance || filesData.length === 0) return; 
            isProcessing = true; 
            processBtn.disabled = true; 
            processBtn.innerHTML = '處理中...'; 
            processBtn.classList.add('opacity-50', 'cursor-not-allowed'); 
            uploadLabel.classList.add('opacity-50', 'pointer-events-none'); 
            const { fetchFile } = window.FFmpegUtil; 
            for (let i = 0; i < filesData.length; i++) { 
                const f = filesData[i]; 
                if (f.status === 'done') continue; 
                f.status = 'processing'; f.progress = 0; 
                renderFiles(); 
                try { 
                    // 確保影片準備好且快轉到 0.1s 供截圖使用 
                    videoEl.src = f.objectURL; 
                    await new Promise(r => { videoEl.onloadedmetadata = r; videoEl.load(); }); 
                    videoEl.currentTime = Math.min(0.1, f.duration / 2); 
                    await new Promise(r => { videoEl.onseeked = r; }); 
                    await ffmpegInstance.writeFile('input.mp4', await fetchFile(f.file)); 
                    const results = []; 
                    for (const spec of TARGET_SPECS) { 
                        // A. 封面截圖 
                        const imgBlob = await compressImage(f.crop, spec.w, spec.h, spec.maxImgKB); 
                        // B. 影片轉檔 
                        const audioKbps = 64; // 保留聲音 
                        const targetTotalKbps = (spec.maxVidKB * 8) / f.duration; 
                        let targetVideoKbps = Math.floor((targetTotalKbps - audioKbps) * 0.90); 
                        if (targetVideoKbps < 15) targetVideoKbps = 15; // 畫質底線 
                        const outName = `out_${spec.w}x${spec.h}.mp4`; 
                        ffmpegInstance.on('progress', ({ progress }) => { 
                            f.progress = Math.max(0, Math.min(100, Math.round(progress * 100))); 
                            renderFiles(); 
                        }); 
                        await ffmpegInstance.exec([ '-i', 'input.mp4', '-vf', `crop=${f.crop.cw}:${f.crop.ch}:${f.crop.cx}:${f.crop.cy},scale=${spec.w}:${spec.h}`, '-c:v', 'libx264', '-b:v', `${targetVideoKbps}k`, '-maxrate', `${targetVideoKbps * 1.2}k`, '-bufsize', `${targetVideoKbps * 2}k`, '-c:a', 'aac', '-b:a', `${audioKbps}k`, '-preset', 'veryfast', outName ]); 
                        const vidData = await ffmpegInstance.readFile(outName); 
                        const vidBlob = new Blob([vidData.buffer], { type: 'video/mp4' }); 
                        await ffmpegInstance.deleteFile(outName); 
                        results.push({ specName: `${spec.w}x${spec.h}`, vidUrl: URL.createObjectURL(vidBlob), vidSize: vidBlob.size, vidPass: vidBlob.size <= spec.maxVidKB * 1024, imgUrl: URL.createObjectURL(imgBlob), imgSize: imgBlob.size, imgPass: imgBlob.size <= spec.maxImgKB * 1024 }); 
                    } 
                    await ffmpegInstance.deleteFile('input.mp4'); 
                    URL.revokeObjectURL(f.objectURL); // 釋放記憶體 
                    f.results = results; 
                    f.status = 'done'; 
                    renderFiles(); 
                } catch (error) { 
                    console.error("檔案處理錯誤:", error); 
                    f.status = 'pending'; // 發生錯誤退回待處理 
                    renderFiles(); 
                } 
            } 
            isProcessing = false; 
            processBtn.disabled = false; 
            processBtn.innerHTML = '▶ 開始批次轉檔'; 
            processBtn.classList.remove('opacity-50', 'cursor-not-allowed'); 
            uploadLabel.classList.remove('opacity-50', 'pointer-events-none'); 
        }; 
    </script>
</body>
</html>
